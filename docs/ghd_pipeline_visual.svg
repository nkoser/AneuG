<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .bg { fill: #f8fbff; }
      .title { font: 700 34px 'DejaVu Sans', Arial, sans-serif; fill: #111; }
      .sub { font: 600 22px 'DejaVu Sans', Arial, sans-serif; fill: #1b1b1b; }
      .txt { font: 500 17px 'DejaVu Sans', Arial, sans-serif; fill: #222; }
      .tiny { font: 500 14px 'DejaVu Sans', Arial, sans-serif; fill: #333; }
      .card { stroke: #2b2b2b; stroke-width: 2; rx: 14; ry: 14; }
      .phaseA { fill: #eaf4ff; }
      .phaseB { fill: #eefbe8; }
      .checkpoint { fill: #fff5de; }
      .out { fill: #ffe9ed; }
      .arrow { stroke: #2f2f2f; stroke-width: 2.8; fill: none; marker-end: url(#ah); }
      .thin { stroke-width: 2; }
      .mesh { fill: #dbe7ff; stroke: #4e678f; stroke-width: 2; }
      .mesh2 { fill: #ffdfe1; stroke: #8d4a4f; stroke-width: 2; }
      .opening { fill: #ffd166; stroke: #9a6a00; stroke-width: 1.5; }
      .seed { fill: #5d9cec; stroke: #124a91; stroke-width: 1.5; }
      .loop { fill: none; stroke: #4fa36f; stroke-width: 2; stroke-dasharray: 6 6; }
      .divider { stroke: #8aa1b4; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
    <marker id="ah" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2f2f2f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="980" class="bg"/>

  <text x="40" y="58" class="title">AneuG Pipeline (visuell): Registrierung -> Morphen -> GHD-Token</text>
  <line x1="800" y1="110" x2="800" y2="940" class="divider"/>
  <text x="70" y="132" class="sub">Phase A: Registrierung (einmal pro Case)</text>
  <text x="860" y="132" class="sub">Phase B: GHD-Morphing (pro Training)</text>

  <!-- Left column: canonical + target visual -->
  <rect x="60" y="170" width="330" height="330" class="card phaseA"/>
  <text x="85" y="205" class="txt">Canonical Mesh C</text>
  <path d="M130,300 C120,250 170,220 220,235 C290,210 330,280 300,335 C310,390 250,430 190,405 C150,415 115,355 130,300 Z" class="mesh"/>
  <circle cx="175" cy="285" r="10" class="opening"/>
  <circle cx="255" cy="300" r="10" class="opening"/>
  <circle cx="220" cy="365" r="10" class="opening"/>
  <text x="85" y="455" class="tiny">Opening-Punkte klicken -> Opening-Patches erzeugen</text>
  <text x="85" y="478" class="tiny">+ Seeds fur Differentiable Centreline setzen</text>

  <rect x="410" y="170" width="330" height="330" class="card phaseA"/>
  <text x="435" y="205" class="txt">Target Mesh T_i</text>
  <path d="M485,310 C470,250 530,225 585,242 C650,230 700,285 665,345 C660,405 590,435 540,410 C500,418 468,365 485,310 Z" class="mesh2"/>
  <circle cx="530" cy="290" r="10" class="opening"/>
  <circle cx="615" cy="310" r="10" class="opening"/>
  <circle cx="575" cy="370" r="10" class="opening"/>
  <text x="435" y="455" class="tiny">Gleicher Schritt fur jedes Target</text>
  <text x="435" y="478" class="tiny">damit Constraints pro Case vorliegen</text>

  <!-- registration outputs -->
  <rect x="60" y="540" width="330" height="150" class="card checkpoint"/>
  <text x="85" y="582" class="txt">opa_checkpoint.pkl</text>
  <text x="85" y="612" class="tiny">Opening-Flachen + Mapping</text>
  <text x="85" y="636" class="tiny">(fur Canonical und Target separat)</text>

  <rect x="410" y="540" width="330" height="150" class="card checkpoint"/>
  <text x="435" y="582" class="txt">diff_centreline_checkpoint.pkl</text>
  <text x="435" y="612" class="tiny">Seeds + wave_loops</text>
  <text x="435" y="636" class="tiny">(fur Canonical und Target separat)</text>

  <!-- centreline mini visual -->
  <rect x="60" y="715" width="680" height="190" class="card phaseA"/>
  <text x="85" y="750" class="txt">DCE-Idee (vereinfacht): Seeds -> Wellen -> Loops -> Centreline-Punkte</text>
  <path d="M110,820 C160,760 260,760 310,820 C360,880 460,880 510,820 C560,760 650,760 700,820" class="mesh"/>
  <circle cx="120" cy="810" r="6" class="seed"/>
  <circle cx="305" cy="820" r="6" class="seed"/>
  <circle cx="510" cy="820" r="6" class="seed"/>
  <ellipse cx="180" cy="820" rx="40" ry="24" class="loop"/>
  <ellipse cx="390" cy="820" rx="45" ry="28" class="loop"/>
  <ellipse cx="610" cy="820" rx="38" ry="22" class="loop"/>
  <text x="85" y="880" class="tiny">Diese Loops werden als differenzierbare Centreline-Information gespeichert.</text>

  <!-- arrows in phase A -->
  <line x1="225" y1="500" x2="225" y2="540" class="arrow"/>
  <line x1="575" y1="500" x2="575" y2="540" class="arrow"/>
  <line x1="390" y1="615" x2="410" y2="615" class="arrow thin"/>

  <!-- Right side: morphing -->
  <rect x="860" y="170" width="690" height="200" class="card phaseB"/>
  <text x="885" y="205" class="txt">Morphing: Canonical C wird zum Target T_i deformiert</text>
  <path d="M910,290 C900,245 945,220 990,235 C1045,220 1090,260 1070,315 C1060,355 1010,380 965,365 C930,372 900,330 910,290 Z" class="mesh"/>
  <path d="M1160,290 C1145,245 1200,220 1248,237 C1308,224 1353,265 1330,322 C1322,358 1270,382 1226,366 C1187,374 1150,330 1160,290 Z" class="mesh2"/>
  <line x1="1088" y1="300" x2="1140" y2="300" class="arrow"/>
  <text x="1015" y="340" class="tiny">GHD-Parameter theta</text>
  <text x="1160" y="345" class="tiny">C_warp(theta)</text>
  <text x="1260" y="345" class="tiny">~ Target</text>

  <rect x="860" y="400" width="690" height="230" class="card phaseB"/>
  <text x="885" y="435" class="txt">Losses, die zusammen optimiert werden</text>
  <rect x="900" y="460" width="610" height="48" class="card phaseB"/>
  <text x="920" y="491" class="txt">1) Global Mesh Loss</text>
  <rect x="900" y="520" width="610" height="48" class="card phaseB"/>
  <text x="920" y="551" class="txt">2) Opening Alignment Loss (aus opa_checkpoint)</text>
  <rect x="900" y="580" width="610" height="48" class="card phaseB"/>
  <text x="920" y="611" class="txt">3) Centreline Loss (aus diff_centreline_checkpoint)</text>

  <rect x="860" y="660" width="690" height="130" class="card out"/>
  <text x="885" y="700" class="txt">Output pro Case</text>
  <text x="885" y="732" class="txt">ghb_fitting_checkpoint.pkl -> GHD_coefficient (Token) + R/s/T</text>

  <rect x="860" y="820" width="690" height="85" class="card checkpoint"/>
  <text x="885" y="854" class="tiny">Danach verwenden first_stage/second_stage genau diese GHD-Tokens als Datensatz.</text>

  <!-- right arrows -->
  <line x1="1205" y1="370" x2="1205" y2="400" class="arrow"/>
  <line x1="1205" y1="630" x2="1205" y2="660" class="arrow"/>
  <line x1="1205" y1="790" x2="1205" y2="820" class="arrow"/>

  <!-- cross handoff -->
  <path d="M740,620 C820,620 820,250 860,250" class="arrow"/>
  <text x="742" y="604" class="tiny">geladene Constraints</text>
</svg>
