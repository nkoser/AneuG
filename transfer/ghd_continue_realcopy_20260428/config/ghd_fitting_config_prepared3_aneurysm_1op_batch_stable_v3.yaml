# Batch-stable profile for many cases on one GPU (5 parallel workers).
# Prioritizes stability/mesh quality over aggressive speed.

register: 0
chk_num: 4
epochs: 7000

# Main args
device: cuda:0
root_template: /workspace/AneuG/checkpoints
root_target: /data/ghd_prepared_meshes_3_aneurysm_1op
name_canonical: canonical_average
name_target: item_Case7
case_glob: "*"

viz_freq: 1000
chk_freq: null
log_freq: 200

lr: 0.0015
lr_scheduler: step
step_size: 2000
gamma: 0.8

early_stopping: 1
early_stopping_patience: 700
early_stopping_min_delta: 0.00001
early_stopping_min_epochs: 1500
nonfinite_guard: 1

num_op: 1
num_Basis: 144
mix_lap_weights:
  - 1.0
  - 0.1
  - 0.1
sample_num: 180000
op_sample_num: 900
op_clean_threshold: 0.2
op_bold: 0

save_root: /workspace/AneuG/checkpoints/ghd_fitting_prepared3_aneurysm_1op
meta: prepared3_aneurysm_1op_batch_stable_v4

num_sp: 2
do_dpi: 4
do_style: number_control_v2
do_loss_type: dice_loss_attention
use_do_dropper: 0
attention_max_w: 3.0
attention_smooth: 0.02
do_number: 15000
weighter_style: strategy_v1_linear
opening_match_mode: index
opening_normal_bidirectional: 1
mesh_filename: part_aligned.obj

# Checkpoints are generated by the preprocessing script.
redo_registration: 0
auto_opening_method: normals
auto_registration_mode: load_or_compute
opa_checkpoint_name: opa_checkpoint_1op
centreline_checkpoint_name: diff_centreline_checkpoint_1op

# Optional QC rendering (off by default)
render_auto_registration: 0
render_auto_registration_only: 0
render_auto_registration_overwrite: 0
render_auto_registration_dir: /workspace/AneuG/checkpoints/auto_registration_qc_prepared3_aneurysm_1op

parallel_cases: 5
parallel_devices: "cuda:0"

# Loss weights
loss_weighting:
  loss_do: 1.0
  loss_p0: 1.0
  loss_n1: 0.7
  loss_laplacian: 0.2
  loss_edge: 0.2
  loss_consistency: 0.3
  loss_rigid: 90.0
  loss_openings_p: 8.0
  loss_openings_n: 0.02
  loss_diff_centreline: 4.0
  loss_thickness: 1.0
