# Default config for ghd_fitting.py
register: false
chk_num: 4
epochs: 15000

# Main args
device: cuda:0
root_template: ./checkpoints/alignment
root_target: ./checkpoints/alignment
name_canonical: canonical_typeB
name_target: AN213_full_clean 
viz_freq: 200
chk_freq: null
log_freq: 100
lr: 0.00075
lr_scheduler: plateau
step_size: 2500
gamma: 0.75
plateau_factor: 0.5
plateau_patience: 300
plateau_threshold: 0.0001
plateau_cooldown: 100
min_lr: 0.000001
early_stopping: 1
early_stopping_patience: 1200
early_stopping_min_delta: 0.00001
early_stopping_min_epochs: 2000
num_op: 3
num_Basis: 169
mix_lap_weights:
  - 1.0
  - 0.1
  - 0.1
sample_num: 250000
op_sample_num: 1000
op_clean_threshold: 0.2
op_bold: 0
save_root: ./checkpoints/ghd_fitting_output_15000
meta: cut_446_decreasing_centrelineloss_10
num_sp: 2
do_dpi: 4
do_style: number_control_v2
do_loss_type: dice_loss_attention
use_do_dropper: 0
attention_max_w: 3.0
attention_smooth: 0.02
do_number: 25000
weighter_style: strategy_v1_linear
mesh_filename: part_aligned.obj

# Loss weights
loss_weighting:
  loss_do: 1.0
  loss_p0: 1.0
  loss_n1: 0.8
  loss_laplacian: 0.1
  loss_edge: 0.1
  loss_consistency: 0.1
  loss_rigid: 100.0
  loss_openings_p: 5
  loss_openings_n: 0.1
  loss_diff_centreline: 10.0
