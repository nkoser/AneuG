# Cap-v6 finish v5: opening-handling overhaul.
#   - rim_ordered cyclic correspondence with plane-angle parameterisation
#     for both warped and target rims (was: random rim chamfer).
#   - decap_chamfer N-ring expansion (was: exact cap faces only) so the
#     global surface chamfer truly leaves the rim free.
#   - new robust loss_openings_centroid_axis (centroid distance + plane
#     axis alignment) at full strength throughout — well-conditioned
#     gradient even when the rim is far from target.
#   - loss_openings_rim_curvature now active (cyclic curvature profile).
# Continues from copied 1500-epoch round-robin checkpoints. Separate
# save_root so this can run in parallel with the v4 finish job.

register: 0
chk_num: 4
epochs: 4000

# Main args
device: cuda:0
root_template: /workspace/AneuG/checkpoints
root_target: /data/ghd_prepared_meshes_3_aneurysm_1op_new
name_canonical: canonical_average
name_target: item_Case7
case_glob: "*"

include_cases_file: /workspace/AneuG/config/cap_v6_finish_v3_noitem_include.txt

# Eigenvector cache (shared, read-only).
canonical_chk: /workspace/AneuG/checkpoints/canonical_average/eigen_chk_144.pkl

# No round-robin: finish each case to full epochs (or early stop).
roundrobin_step: 0

# Tier-A speedup: PNG render takes ~2-3 s; halve frequency.
viz_freq: 1000
chk_freq: null
log_freq: 400

lr: 0.0025
lr_scheduler: step
step_size: 1800
gamma: 0.8

# PrefitGuard (unchanged from v4)
prefit_guard_enabled: 1
prefit_opening_p_threshold: 0.14
prefit_opening_p_severe_threshold: 0.28
prefit_opening_surface_p_threshold: 0.012
prefit_opening_surface_p_severe_threshold: 0.03
prefit_opening_plane_threshold: 0.045
prefit_opening_plane_severe_threshold: 0.09
prefit_centreline_threshold: 0.18
prefit_centreline_severe_threshold: 0.30

# Tier-A: tighter early stopping; many cases plateau by 2000-2500.
early_stopping: 1
early_stopping_patience: 80
early_stopping_min_delta: 0.0001
early_stopping_min_epochs: 1200
nonfinite_guard: 1

keep_size: 0
grad_clip_norm: 1.0

num_op: 1
num_Basis: 144
mix_lap_weights:
  - 1.0
  - 0.1
  - 0.1
# Tier-A speedup: 140k -> 40k surface samples per epoch (kNN dominant cost).
# 144 GHD eigenmodes cannot resolve detail above this density anyway.
sample_num: 40000
# 1200 -> 400 opening surface samples (num_op=1, no aliasing risk at 400).
op_sample_num: 400
op_clean_threshold: 0.2
op_bold: 0

# NEW save_root for v5; copy the same 1500-epoch chk dirs into here before
# launching for the full job (smoke test does not require this).
save_root: /workspace/AneuG/checkpoints/ghd_fitting_prepared3_aneurysm_1op_cap_v6_finish_v5
meta: prepared3_aneurysm_1op_quality_cap_v6_roundrobin_v3

num_sp: 2
do_dpi: 4
do_style: number_control_v2
do_loss_type: dice_loss_attention
use_do_dropper: 0
attention_max_w: 3.0
attention_smooth: 0.02
# Tier-A speedup: dice loss is stable from ~4k in/out points.
do_number: 5000

weighter_style: strategy_v2_robust_opening
opening_warmup_epochs: 500
opening_start_scale: 0.45
opening_surface_start_scale: 0.45
opening_normal_start_scale: 0.55
opening_plane_start_scale: 0.18
opening_rim_start_scale: 0.30
centreline_start_scale: 0.22

opening_match_mode: index
opening_normal_bidirectional: 1
# Switch from random boundary chamfer to ordered cyclic rim matching with
# plane-angle parameterisation (works for unordered target rims too).
opening_loss_mode: rim_ordered
# N-ring expansion of the cap-face mask: rings=1 also drops faces touching
# the rim, freeing the rim row from the global surface chamfer pull.
decap_chamfer: 1
decap_chamfer_rings: 1
mesh_filename: part_aligned.obj

redo_registration: 0
auto_opening_method: normals
auto_registration_mode: load_or_compute
opa_checkpoint_name: opa_checkpoint_1op
centreline_checkpoint_name: diff_centreline_checkpoint_1op

render_auto_registration: 0
render_auto_registration_only: 0
render_auto_registration_overwrite: 0
render_auto_registration_dir: /workspace/AneuG/checkpoints/auto_registration_qc_prepared3_aneurysm_1op

# Run 3 cases in parallel on cuda:0 — same budget as v4.
parallel_cases: 3
parallel_devices: "cuda:0"

# Stage-2 rim refinement still suspicious-only.
rim_refine_enabled: 1
rim_refine_on_suspicious_only: 1
rim_refine_epochs: 160
rim_refine_lr: 0.0007
rim_refine_rings: 2
rim_refine_laplacian_weight: 0.12
rim_refine_edge_weight: 0.08
rim_refine_opening_p_weight: 12.0
rim_refine_opening_plane_weight: 8.0
rim_refine_surface_p_weight: 2.0
rim_refine_grad_clip_norm: 0.5

loss_weighting:
  loss_do: 1.25
  loss_p0: 1.5
  loss_n1: 0.8
  loss_laplacian: 0.12
  loss_edge: 0.12
  loss_consistency: 0.12
  loss_rigid: 12.0
  # Boundary chamfer (now ordered cyclic L2 — see opening_loss_mode)
  loss_openings_p: 8.0
  # Cap-surface chamfer (kept lower; ordered rim is the primary signal).
  loss_openings_surface_p: 2.0
  loss_openings_n: 0.01
  loss_openings_plane: 20.0
  # NEW: cyclic curvature profile around the rim. Catches local rim
  # shape differences (oval vs round vs kinked).
  loss_openings_rim_curvature: 0.6
  # NEW: robust low-frequency centroid + plane-axis loss. Always full
  # strength — survives bad initialisation, drives gross alignment fast.
  loss_openings_centroid_axis: 6.0
  loss_diff_centreline: 1.0
  loss_thickness: 0.05
