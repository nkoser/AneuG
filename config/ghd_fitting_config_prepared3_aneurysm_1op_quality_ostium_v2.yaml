# Quality profile with stronger ostium-rim stabilization.
# Keeps the fixed (non-flipped) alignment from prepared data.

register: 0
chk_num: 4
epochs: 15000

# Main args
device: cuda:0
root_template: /workspace/AneuG/checkpoints
root_target: /data/ghd_prepared_meshes_3_aneurysm_1op
name_canonical: canonical_average
name_target: item_Case7
case_glob: "*"

viz_freq: 300
chk_freq: null
log_freq: 100

lr: 0.0006
lr_scheduler: step
step_size: 2500
gamma: 0.8

early_stopping: 1
early_stopping_patience: 1200
early_stopping_min_delta: 0.00001
early_stopping_min_epochs: 2000
nonfinite_guard: 1

num_op: 1
num_Basis: 144
mix_lap_weights:
  - 1.0
  - 0.1
  - 0.1
sample_num: 280000
op_sample_num: 2500
op_clean_threshold: 0.2
op_bold: 0

save_root: /workspace/AneuG/checkpoints/ghd_fitting_prepared3_aneurysm_1op_03
meta: prepared3_aneurysm_1op_quality_ostium_v2

num_sp: 2
do_dpi: 4
do_style: number_control_v2
do_loss_type: dice_loss_attention
use_do_dropper: 0
attention_max_w: 3.0
attention_smooth: 0.02
do_number: 25000
weighter_style: constant
opening_match_mode: index
opening_normal_bidirectional: 1
opening_loss_mode: boundary
mesh_filename: part_aligned.obj

# Checkpoints are generated by the preprocessing script.
redo_registration: 0
auto_opening_method: normals
auto_registration_mode: load_or_compute
opa_checkpoint_name: opa_checkpoint_1op
centreline_checkpoint_name: diff_centreline_checkpoint_1op

# Optional QC rendering (off by default)
render_auto_registration: 0
render_auto_registration_only: 0
render_auto_registration_overwrite: 0
render_auto_registration_dir: /workspace/AneuG/checkpoints/auto_registration_qc_prepared3_aneurysm_1op

parallel_cases: 1
parallel_devices: "cuda:0"

# Loss weights (stronger opening and smoother boundary behavior)
loss_weighting:
  loss_do: 1.0
  loss_p0: 1.0
  loss_n1: 0.8
  loss_laplacian: 0.2
  loss_edge: 0.2
  loss_consistency: 0.25
  loss_rigid: 120.0
  loss_openings_p: 12.0
  loss_openings_n: 0.05
  loss_diff_centreline: 2.5
  loss_thickness: 0.5
